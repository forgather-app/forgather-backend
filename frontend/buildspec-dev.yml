version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd frontend
      - npm ci

  build:
    commands:
      - npm run build:dev
      - |
        aws s3 cp dist/ s3://techcourse-project-2025/photogather/v2/fe/dev/ \
          --recursive \
          --exclude "*" \
          --include "*.html" \
          --sse AES256 \
      - |
        aws s3 cp dist/ s3://techcourse-project-2025/photogather/v2/fe/dev/ \
          --recursive \
          --exclude "*.html" \
          --sse AES256 \

artifacts:
  base-directory: frontend/dist
  files:
    - '**/*'
