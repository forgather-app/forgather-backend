version: 0.0
os: linux

files:
  - source: /forgather-0.0.1-SNAPSHOT.jar
    destination: /home/ubuntu/forgather-backend
  - source: /scripts
    destination: /home/ubuntu/forgather-backend/scripts

file_exists_behavior: OVERWRITE

permissions:
  - object: /home/ubuntu/forgather-backend
    owner: ubuntu
    group: ubuntu
    mode: "755"
    type:
      - directory

  - object: /home/ubuntu/forgather-backend/forgather-0.0.1-SNAPSHOT.jar
    owner: ubuntu
    group: ubuntu
    mode: "644"
    type:
      - file

  - object: /home/ubuntu/forgather-backend/scripts
    owner: ubuntu
    group: ubuntu
    mode: "755"
    type:
      - directory

hooks:
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 120
      runas: root

  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: root
