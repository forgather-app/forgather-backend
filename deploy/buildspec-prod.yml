version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - echo "[install] Git clone 시작"
      - pwd
      - ls
      - rm -rf *
      - git clone -b v2/main --single-branch https://github.com/forgather-app/forgather-backend.git
      - echo "[install] git-crypt 설치"
      - sudo apt-get update
      - sudo apt-get install -y git-crypt

  pre_build:
    commands:
      - pwd
      - ls
      - cd forgather-backend
      - echo "[pre_build] git-crypt unlock"
      - echo $gitcrypt | xxd -r -p > git-crypt-key
      - git-crypt unlock git-crypt-key

  build:
    commands:
      - pwd
      - ls
      - echo "[build] Gradle 빌드 (테스트 생략)"
      - chmod +x ./gradlew
      - ./gradlew build -x test
      - echo "[build] jar, appspec, deploy 파일 복사"
      - cp build/libs/forgather-0.0.1-SNAPSHOT.jar ..
      - cp deploy/appspec-prod.yml ../appspec.yml
      - mkdir -p ../scripts
      - cp deploy/scripts/*.sh ../scripts/
      - chmod +x ../scripts/*.sh

artifacts:
  files:
    - forgather-0.0.1-SNAPSHOT.jar
    - appspec.yml
    - scripts/**/*
