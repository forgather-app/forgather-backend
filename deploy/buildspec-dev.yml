version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - echo "Git clone 시작"
      - rm -rf * # 소스 스테이지에서 내려온 불완전한 zip 제거
      - git clone -b v2/develop --single-branch https://github.com/forgather-app/forgather-backend.git
      - cd forgather-backend
      - echo "[install] git-crypt 설치"
      - sudo apt-get install git-crypt
      - echo "[install] 압축 해제 준비 및 디렉토리 생성"
      - mkdir -p src/main/resources/

  pre_build:
    commands:
      - echo "[pre_build] .yml 등 설정 파일 준비"
      - echo $gitcrypt | xxd -r -p > git-crypt-key
      - git-crypt unlock git-crypt-key

  build:
    commands:
      - cp src/main/resources/application-dev.yml src/main/resources/application.yml
      - echo "[build] Gradle 빌드 (테스트 생략)"
      - chmod +x ./gradlew
      - ./gradlew build -x test
      - echo "[build] JAR, deploy 파일 복사"
      - cp build/libs/forgather-0.0.1-SNAPSHOT.jar ..
      - cp deploy/appspec.yml ..
      - cp deploy/deploy-dev.sh ../deploy.sh

artifacts:
  files:
    - forgather-0.0.1-SNAPSHOT.jar
    - appspec.yml
    - deploy.sh
