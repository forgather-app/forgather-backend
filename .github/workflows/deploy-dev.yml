name: Deploy Dev

on:
  push:
    branches:
      - v2/develop
      - v2/refactor/#117-github-actions-cd
  workflow_dispatch:  # 워크플로우 수동 실행 가능

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false  # 먼저 실행 중인 작업 있을 시 대기 후 실행

env:
  ARTIFACT_PREFIX: deploy/dev
  ARTIFACT_RETENTION_COUNT: 10
  CODEDEPLOY_STOP_WAIT_ATTEMPTS: 30
  CODEDEPLOY_STOP_WAIT_INTERVAL_SECONDS: 5
  JAR_NAME: forgather-0.0.1-SNAPSHOT.jar

jobs:
  deploy:
    name: Build and deploy dev
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    permissions:
      id-token: write  # aws 통신을 위한 oidc 토큰

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Install deployment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt jq zip unzip

      - name: Unlock git-crypt files
        env:
          GIT_CRYPT_KEY_HEX: ${{ secrets.GIT_CRYPT_KEY_HEX }}
        run: |
          if [ -z "${GIT_CRYPT_KEY_HEX}" ]; then
            echo "GIT_CRYPT_KEY_HEX secret is required." >&2
            exit 1
          fi

          trap 'rm -f git-crypt-key' EXIT
          umask 077
          printf '%s' "$GIT_CRYPT_KEY_HEX" | tr -d '[:space:]' | xxd -r -p > git-crypt-key
          git-crypt unlock git-crypt-key
          
      - name: Validate deployment configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          CODEDEPLOY_APPLICATION: ${{ vars.CODEDEPLOY_APPLICATION }}
          CODEDEPLOY_DEPLOYMENT_GROUP: ${{ vars.CODEDEPLOY_DEPLOYMENT_GROUP }}
          DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
        run: |
          missing=0
          for name in AWS_REGION AWS_ROLE_TO_ASSUME CODEDEPLOY_APPLICATION CODEDEPLOY_DEPLOYMENT_GROUP DEPLOY_ARTIFACT_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "${name} environment variable is required." >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Build application
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test --no-daemon

      - name: Create CodeDeploy bundle
        run: |
          artifact_name="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-forgather-dev.zip"
          bundle_dir="build/codedeploy"

          mkdir -p "$bundle_dir"
          cp "build/libs/${JAR_NAME}" "$bundle_dir/"
          cp deploy/appspec-dev.yml "$bundle_dir/appspec.yml"
          cp deploy/deploy-dev.sh "$bundle_dir/deploy.sh"
          chmod +x "$bundle_dir/deploy.sh"

          bash -n "$bundle_dir/deploy.sh"
          test -f "$bundle_dir/${JAR_NAME}"
          test -f "$bundle_dir/appspec.yml"
          test -f "$bundle_dir/deploy.sh"

          (cd "$bundle_dir" && zip -r "../${artifact_name}" .)
          unzip -l "build/${artifact_name}"

          echo "ARTIFACT_NAME=${artifact_name}" >> "$GITHUB_ENV"
          echo "ARTIFACT_KEY=${ARTIFACT_PREFIX}/${GITHUB_SHA}/${artifact_name}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload bundle to S3
        env:
          DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
        run: |
          aws s3 cp "build/${ARTIFACT_NAME}" "s3://${DEPLOY_ARTIFACT_BUCKET}/${ARTIFACT_KEY}"
          echo "ARTIFACT_UPLOADED=true" >> "$GITHUB_ENV"

      - name: Create CodeDeploy deployment
        env:
          CODEDEPLOY_APPLICATION: ${{ vars.CODEDEPLOY_APPLICATION }}
          CODEDEPLOY_DEPLOYMENT_GROUP: ${{ vars.CODEDEPLOY_DEPLOYMENT_GROUP }}
          DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
        run: |
          deployment_id="$(
            aws deploy create-deployment \
              --application-name "$CODEDEPLOY_APPLICATION" \
              --deployment-group-name "$CODEDEPLOY_DEPLOYMENT_GROUP" \
              --description "forgather dev ${GITHUB_SHA}" \
              --s3-location bucket="$DEPLOY_ARTIFACT_BUCKET",key="$ARTIFACT_KEY",bundleType=zip \
              --query 'deploymentId' \
              --output text
          )"

          echo "DEPLOYMENT_ID=${deployment_id}" >> "$GITHUB_ENV"
          echo "Created CodeDeploy deployment: ${deployment_id}"

      - name: Wait for CodeDeploy deployment
        run: |
          set +e
          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"
          wait_status=$?
          set -e

          aws deploy get-deployment \
            --deployment-id "$DEPLOYMENT_ID" \
            --query 'deploymentInfo.{status:status,completeTime:completeTime,errorInformation:errorInformation}' \
            --output json

          exit "$wait_status"

      - name: Stop cancelled CodeDeploy deployment
        if: cancelled()
        run: |
          if [ -z "${DEPLOYMENT_ID:-}" ]; then
            echo "No CodeDeploy deployment to stop."
            exit 0
          fi

          set +e
          aws deploy stop-deployment \
            --deployment-id "$DEPLOYMENT_ID" \
            --auto-rollback-enabled
          stop_status=$?
          set -e

          if [ "$stop_status" -ne 0 ]; then
            echo "CodeDeploy stop/rollback request failed."
          fi

          echo "Waiting for CodeDeploy deployment to stop or reach a terminal status."
          for attempt in $(seq 1 "$CODEDEPLOY_STOP_WAIT_ATTEMPTS"); do
            deployment_status="$(
              aws deploy get-deployment \
                --deployment-id "$DEPLOYMENT_ID" \
                --query 'deploymentInfo.status' \
                --output text 2>/dev/null || true
            )"

            echo "CodeDeploy status: ${deployment_status:-unknown} (${attempt}/${CODEDEPLOY_STOP_WAIT_ATTEMPTS})"

            case "$deployment_status" in
              Stopped|Failed)
                exit 0
                ;;
              Succeeded)
                echo "Deployment already succeeded; preserving artifact."
                echo "SKIP_ARTIFACT_DELETE=true" >> "$GITHUB_ENV"
                exit 0
                ;;
            esac

            sleep "$CODEDEPLOY_STOP_WAIT_INTERVAL_SECONDS"
          done

          echo "Timed out waiting for CodeDeploy to stop; preserving artifact."
          echo "SKIP_ARTIFACT_DELETE=true" >> "$GITHUB_ENV"

      - name: Delete failed deployment artifact
        if: failure() || cancelled()
        env:
          DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
        run: |
          if [ "${ARTIFACT_UPLOADED:-false}" != "true" ]; then
            echo "No uploaded deployment artifact to delete."
            exit 0
          fi

          if [ "${SKIP_ARTIFACT_DELETE:-false}" = "true" ]; then
            echo "Skipping artifact deletion."
            exit 0
          fi

          aws s3 rm "s3://${DEPLOY_ARTIFACT_BUCKET}/${ARTIFACT_KEY}"

      - name: Cleanup old successful artifacts
        if: success()
        env:
          DEPLOY_ARTIFACT_BUCKET: ${{ vars.DEPLOY_ARTIFACT_BUCKET }}
        run: |
          objects_to_delete="$(
            aws s3api list-objects-v2 \
              --bucket "$DEPLOY_ARTIFACT_BUCKET" \
              --prefix "${ARTIFACT_PREFIX}/" \
              --output json \
            | jq --argjson keep "$ARTIFACT_RETENTION_COUNT" '
                (.Contents // [])
                | map(select(.Key | endswith(".zip")))
                | sort_by(.LastModified)
                | reverse
                | .[$keep:]
                | map({Key})
              '
          )"

          delete_count="$(jq 'length' <<< "$objects_to_delete")"

          if [ "$delete_count" -eq 0 ]; then
            echo "No old successful artifacts to delete."
            exit 0
          fi

          jq -n --argjson objects "$objects_to_delete" \
            '{Objects: $objects, Quiet: true}' > delete-objects.json

          aws s3api delete-objects \
            --bucket "$DEPLOY_ARTIFACT_BUCKET" \
            --delete file://delete-objects.json

          echo "Deleted ${delete_count} old artifact(s)."
