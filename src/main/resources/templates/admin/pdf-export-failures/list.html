<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 추출 실패 - Forgather Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin/tailwind-output.css}">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/pdf-export-failures.css}">
</head>
<body class="bg-bg-color min-h-screen flex flex-col font-sans">
    <header th:replace="~{admin/layout/fragments :: header(currentPage='pdf-export-failures')}"></header>
    <main class="flex-1 py-xl px-md">
        <div class="max-w-7xl mx-auto">
            <div class="page-header mb-xl">
                <h2 class="text-3xl font-bold text-text-primary mb-xs">PDF 추출 실패</h2>
                <p class="text-text-secondary">Lambda에 기록된 실패 정보를 조회합니다. 시각은 브라우저의 현지 시간 기준입니다.</p>
            </div>
            <p id="totalCountInfo" class="mb-md" aria-live="polite"></p>
            <p id="listCopyStatus" role="status" aria-live="polite" class="mb-md"></p>
            <p id="listLoading" role="status" hidden>실패 정보를 불러오는 중...</p>
            <div id="listError" role="alert" hidden>
                <p id="listErrorMessage"></p>
                <button id="retryListBtn" class="failure-button" type="button">다시 시도</button>
            </div>
            <div class="failure-table-container bg-surface rounded-lg shadow-md">
                <table class="data-table w-full">
                    <caption class="sr-only">PDF 추출 실패 목록</caption>
                    <thead><tr>
                        <th scope="col">실패 시각</th>
                        <th scope="col">작업 ID</th>
                        <th scope="col">요청 ID</th>
                        <th scope="col">실패 단계</th>
                        <th scope="col">오류 유형</th>
                        <th scope="col">처리 상태</th>
                        <th scope="col">상세</th>
                    </tr></thead>
                    <tbody id="failuresTableBody"></tbody>
                </table>
                <p id="emptyMessage" class="p-lg text-center text-text-secondary" hidden>실패 기록이 없습니다.</p>
            </div>
            <nav id="pagination" class="pagination" aria-label="실패 목록 페이지" style="display: none;"></nav>
        </div>
    </main>
    <footer th:replace="~{admin/layout/fragments :: footer}"></footer>
    <dialog id="detailModal" class="modal-detail" aria-labelledby="detailTitle">
        <div class="flex items-center justify-between mb-lg">
            <h3 id="detailTitle" class="text-xl font-semibold">PDF 추출 실패 상세</h3>
            <button id="closeDetailBtn" type="button" class="failure-button" autofocus>닫기</button>
        </div>
        <p id="detailLoading" role="status" hidden>상세 정보를 불러오는 중...</p>
        <div id="detailError" role="alert" hidden>
            <p id="detailErrorMessage"></p>
            <button id="retryDetailBtn" type="button" class="failure-button">다시 시도</button>
        </div>
        <p id="copyStatus" role="status" aria-live="polite" class="mb-md"></p>
        <dl id="detailContent" hidden></dl>
    </dialog>
    <script th:src="@{/js/admin/auth.js}"></script>
    <script th:src="@{/js/admin/api.js}"></script>
    <script th:src="@{/js/admin/pagination.js}"></script>
    <script th:src="@{/js/admin/pdf-export-failures.js}"></script>
</body>
</html>
