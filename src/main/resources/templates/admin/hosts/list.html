<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호스트 관리 - Forgather Admin</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (build-time) -->
    <link rel="stylesheet" th:href="@{/css/admin/tailwind-output.css}">

    <!-- Common CSS (JS 연동 클래스 유지) -->
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
</head>
<body class="bg-bg-color min-h-screen flex flex-col font-sans">
    <!-- Header (Fragment 사용) -->
    <header th:replace="~{admin/layout/fragments :: header(currentPage='hosts')}"></header>

    <!-- Main Content -->
    <main class="flex-1 py-xl px-md">
        <div class="max-w-7xl mx-auto">
            <!--
                Page Header
                - 페이지 제목과 설명을 표시합니다.
                - 사용자에게 현재 페이지가 무엇인지 명확히 알립니다.
            -->
            <div class="mb-xl pb-lg border-b border-border-color">
                <h2 class="text-3xl font-bold text-text-primary mb-xs">호스트 관리 페이지</h2>
                <p class="text-text-secondary">전체 호스트 조회 및 관리 페이지</p>
            </div>

            <!--
                Controls: 페이지 크기 선택 및 총 개수 표시
                - 사용자가 한 페이지에 표시될 아이템 개수를 선택할 수 있습니다.
                - JavaScript에서 변경 이벤트를 감지하여 데이터를 다시 로드합니다.
            -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-md mb-lg p-lg bg-surface rounded-lg shadow-sm">
                <div class="flex items-center gap-sm w-full sm:w-auto">
                    <label for="pageSize" class="text-sm font-medium text-text-secondary whitespace-nowrap">
                        페이지당 항목:
                    </label>
                    <select id="pageSize"
                            class="w-full sm:w-auto min-w-[80px] px-md py-2.5 min-h-[44px] text-sm border border-border-color rounded bg-surface text-text-primary cursor-pointer transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
                        <option value="15" selected>15</option>
                        <option value="30">30</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </div>

            <!--
                테이블 상단 컨트롤: 총 개수 + 이름 검색
                - 이름 검색 API (/admin/hosts/search/by-name)와 연동
                - spaces/list.html의 검색 UI 패턴과 동일
            -->
            <div class="flex flex-wrap items-center justify-between gap-md mb-md">
                <div id="totalCountInfo" class="text-sm text-text-secondary font-medium">
                    <!-- JavaScript에서 동적으로 업데이트 -->
                </div>
                <div class="flex items-center gap-sm">
                    <div class="relative">
                        <input type="text"
                               id="nameSearchInput"
                               class="w-64 pl-md pr-12 py-2.5 min-h-[44px] text-sm border border-border-color rounded-lg bg-surface text-text-primary placeholder-text-muted
                                      focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20
                                      transition-all duration-200"
                               placeholder="호스트 이름 검색..."
                               autocomplete="off">
                        <button type="button" id="nameSearchBtn"
                                class="absolute right-0 top-1/2 -translate-y-1/2 p-2.5 min-w-[44px] min-h-[44px] flex items-center justify-center text-text-muted hover:text-primary rounded transition-colors duration-150 cursor-pointer"
                                aria-label="검색">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </button>
                    </div>
                    <button type="button" id="resetSearchBtn"
                            class="px-md py-2.5 min-h-[44px] text-sm font-medium text-text-secondary bg-surface border border-border-color rounded-lg whitespace-nowrap
                                   hover:bg-bg-color hover:text-text-primary active:scale-[0.98]
                                   transition-all duration-200 cursor-pointer"
                            style="display: none;">
                        초기화
                    </button>
                </div>
            </div>

            <!--
                Loading Spinner
                - API 호출 중에 표시됩니다.
                - 사용자에게 데이터 로딩 중임을 시각적으로 알립니다.
                - 기본적으로 숨김 상태(display: none)이며, JavaScript에서 제어합니다.
            -->
            <div id="loadingSpinner"
                 class="fixed inset-0 bg-black/50 flex flex-col justify-center items-center z-[9999]"
                 style="display: none;">
                <div class="w-12 h-12 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
                <p class="text-white mt-md font-medium">로딩 중...</p>
            </div>

            <!--
                Error Message
                - API 호출 실패 시 에러 메시지를 표시합니다.
                - 사용자 친화적인 에러 메시지를 제공합니다.
                - 기본적으로 숨김 상태이며, JavaScript에서 제어합니다.
            -->
            <div id="errorMessage"
                 class="hidden p-lg mb-lg bg-danger/10 border border-danger/30 rounded-lg text-danger text-center font-medium"
                 style="display: none;"></div>

            <!--
                Hosts Table
                - 호스트 목록을 테이블 형태로 표시합니다.
                - thead: 테이블 헤더 (ID, 호스트명, 스페이스 개수, 생성일)
                - tbody: 테이블 데이터 (JavaScript로 동적 생성)
            -->
            <div class="bg-surface rounded-lg shadow-md overflow-hidden">
                <div class="overflow-x-auto table-scroll-wrapper" id="tableScrollWrapper">
                    <table class="w-full table-fixed" id="hostsTable">
                        <thead>
                            <tr class="bg-neutral-100 border-b-2 border-neutral-300">
                                <th class="px-lg py-md text-left text-xs font-bold text-text-primary uppercase tracking-wider w-[10%] cursor-pointer hover:bg-neutral-200 transition-colors duration-150 select-none group"
                                    data-sort="id">
                                    <div class="flex items-center gap-xs">
                                        <span>ID</span>
                                        <span class="sort-icon text-text-muted transition-opacity duration-150"></span>
                                    </div>
                                </th>
                                <th class="px-lg py-md text-left text-xs font-bold text-text-primary uppercase tracking-wider w-[40%] cursor-pointer hover:bg-neutral-200 transition-colors duration-150 select-none group"
                                    data-sort="name">
                                    <div class="flex items-center gap-xs">
                                        <span>호스트명</span>
                                        <span class="sort-icon text-text-muted transition-opacity duration-150"></span>
                                    </div>
                                </th>
                                <th class="px-lg py-md text-center text-xs font-bold text-text-primary uppercase tracking-wider w-[20%]">스페이스 개수</th>
                                <th class="px-lg py-md text-left text-xs font-bold text-text-primary uppercase tracking-wider w-[30%] cursor-pointer hover:bg-neutral-200 transition-colors duration-150 select-none group"
                                    data-sort="createdAt">
                                    <div class="flex items-center gap-xs">
                                        <span>생성일</span>
                                        <span class="sort-icon text-text-muted transition-opacity duration-150"></span>
                                    </div>
                                </th>
                            </tr>
                        </thead>
                        <tbody id="hostsTableBody" class="divide-y divide-border-color">
                            <!--
                                데이터는 JavaScript로 동적 렌더링됩니다.
                                hosts.js의 renderHostsTable() 함수 참조
                            -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!--
                Pagination
                - 숫자 페이지 네비게이션을 제공합니다.
                - JavaScript의 PaginationUtil을 사용하여 동적으로 렌더링됩니다.
                - 기본적으로 숨김 상태이며, 데이터 로드 후 표시됩니다.
            -->
            <div class="pagination mt-lg" id="pagination" style="display: none;"></div>
        </div>
    </main>

    <!-- Footer (Fragment 사용) -->
    <footer th:replace="~{admin/layout/fragments :: footer}"></footer>

    <!--
        호스트 스페이스 목록 모달
        - 기본적으로 숨김 상태 (display: none)
        - 호스트의 스페이스 개수 클릭 시 표시
        - ESC 키 또는 오버레이 클릭 시 닫힘
        - 모달이 열렸을 때 body의 스크롤 방지
    -->
    <div id="hostSpacesModal"
         class="modal-overlay fixed inset-0 bg-black/60 flex justify-center items-center z-[10000]"
         style="display: none;"
         role="dialog" aria-labelledby="hostSpacesModalTitle" aria-modal="true">
        <div class="modal-container bg-surface rounded-xl shadow-xl max-w-[960px] w-[90%] h-[85vh] flex flex-col">
            <!-- 모달 헤더 -->
            <div class="flex justify-between items-center p-lg border-b border-border-color">
                <div class="flex items-center gap-sm">
                    <button id="backToSpaceListBtn"
                            class="w-9 h-9 flex items-center justify-center text-text-secondary bg-transparent border-none rounded-lg cursor-pointer
                                   hover:bg-bg-color hover:text-text-primary transition-all duration-200"
                            style="display: none;"
                            aria-label="스페이스 목록으로 돌아가기">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <h3 id="hostSpacesModalTitle" class="text-xl font-bold text-text-primary m-0">스페이스 목록</h3>
                </div>
                <button id="closeHostSpacesModalBtn"
                        class="w-11 h-11 flex items-center justify-center text-2xl text-text-secondary bg-transparent border-none rounded-lg cursor-pointer
                               hover:bg-bg-color hover:text-text-primary transition-all duration-200"
                        aria-label="모달 닫기">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <!-- 모달 내용 (슬라이드 래퍼) -->
            <div id="modalSlideWrapper" class="flex-1 min-h-0 overflow-hidden relative">
                <div id="modalPanelContainer" class="flex w-[200%] h-full"
                     style="transform: translateX(0%);">

                    <!-- [패널 1: 스페이스 목록] - 기존 콘텐츠 유지 -->
                    <div class="w-1/2 h-full overflow-y-auto relative p-lg" id="hostSpacesScrollArea">
                        <!-- 로딩 상태 -->
                        <div id="hostSpacesLoading" class="flex flex-col items-center justify-center py-2xl text-text-secondary" style="display: none;">
                            <div class="w-10 h-10 border-[3px] border-border-color border-t-primary rounded-full animate-spin"></div>
                            <p class="mt-md text-sm">스페이스 목록 로딩 중...</p>
                        </div>

                        <!-- 에러 상태 -->
                        <div id="hostSpacesError"
                             class="p-md bg-red-50 border border-red-200 rounded-lg text-danger text-sm text-center"
                             style="display: none;">
                        </div>

                        <!-- 스페이스 목록 (JavaScript로 동적 렌더링) -->
                        <div id="hostSpacesContent" style="display: none;">
                        </div>
                    </div>

                    <!-- [패널 2: 스페이스 상세] - 신규 -->
                    <div class="w-1/2 h-full overflow-y-auto p-lg" id="spaceDetailPanel">
                        <!-- 로딩 상태 -->
                        <div id="spaceDetailLoading" class="flex flex-col items-center justify-center py-2xl text-text-secondary" style="display: none;">
                            <div class="w-10 h-10 border-[3px] border-border-color border-t-primary rounded-full animate-spin"></div>
                            <p class="mt-md text-sm">스페이스 정보 로딩 중...</p>
                        </div>

                        <!-- 에러 상태 -->
                        <div id="spaceDetailError"
                             class="p-md bg-red-50 border border-red-200 rounded-lg text-danger text-sm text-center"
                             style="display: none;">
                        </div>

                        <!-- 상세 콘텐츠 -->
                        <div id="spaceDetailContent" style="display: none;">
                            <dl class="grid grid-cols-[auto_1fr] gap-x-10 gap-y-5 items-baseline">
                                <!-- 스페이스 ID -->
                                <dt class="text-sm text-text-secondary font-medium whitespace-nowrap">스페이스 ID</dt>
                                <dd id="detailSpaceId" class="text-base text-text-primary font-mono m-0">-</dd>

                                <!-- 스페이스 코드 -->
                                <dt class="text-sm text-text-secondary font-medium whitespace-nowrap">스페이스 코드</dt>
                                <dd id="detailSpaceCode" class="text-base text-text-primary font-mono m-0">-</dd>

                                <!-- 스페이스 이름 -->
                                <dt class="text-sm text-text-secondary font-medium whitespace-nowrap">스페이스 이름</dt>
                                <dd id="detailSpaceName" class="text-base text-text-primary font-semibold m-0">-</dd>

                                <!-- 공개 여부 -->
                                <dt class="text-sm text-text-secondary font-medium whitespace-nowrap">공개 여부</dt>
                                <dd id="detailSpacePublic" class="text-base m-0">-</dd>

                                <!-- 구분선 -->
                                <div class="col-span-2 border-t border-border-color my-1"></div>

                                <!-- 작품소개 개수 -->
                                <dt class="text-sm text-text-secondary font-medium whitespace-nowrap">작품소개 개수</dt>
                                <dd id="detailProductCount" class="text-base text-text-primary font-semibold m-0">-</dd>

                                <!-- 방명록 개수 -->
                                <dt class="text-sm text-text-secondary font-medium whitespace-nowrap">방명록 개수</dt>
                                <dd id="detailGuestBookCount" class="text-base text-text-primary font-semibold m-0">-</dd>

                                <!-- 구분선 -->
                                <div class="col-span-2 border-t border-border-color my-1"></div>

                                <!-- 생성일 -->
                                <dt class="text-sm text-text-secondary font-medium whitespace-nowrap">생성일</dt>
                                <dd id="detailCreatedAt" class="text-base text-text-primary m-0">-</dd>

                                <!-- 수정일 -->
                                <dt class="text-sm text-text-secondary font-medium whitespace-nowrap">수정일</dt>
                                <dd id="detailUpdatedAt" class="text-base text-text-primary m-0">-</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 스크롤 하단 페이드 인디케이터 (스크롤 영역 바로 아래, 푸터 위에 겹침) -->
            <div id="hostSpacesScrollFade"
                 class="h-12 -mt-12 pointer-events-none relative z-10 transition-opacity duration-200"
                 style="background: linear-gradient(to top, rgba(255,255,255,0.95), transparent); display: none;">
            </div>

            <!-- 모달 푸터 -->
            <div class="p-lg border-t border-border-color flex items-center justify-between">
                <span id="hostSpacesCountInfo" class="text-xs text-text-muted"></span>
                <div class="flex items-center gap-sm">
                    <button id="hostModalVisitSpaceBtn"
                            class="min-h-[44px] px-lg py-2.5 text-sm font-semibold text-white
                                   bg-cta rounded-lg
                                   hover:bg-cta-hover
                                   active:scale-[0.98] transition-all duration-200 cursor-pointer
                                   focus:outline-none focus:ring-2 focus:ring-cta focus:ring-offset-2"
                            style="display: none;"
                            aria-label="게스트 페이지로 이동">
                        게스트 페이지로 이동
                    </button>
                    <button id="closeHostSpacesFooterBtn"
                            class="min-h-[44px] px-lg py-2.5 text-sm font-medium text-text-secondary
                                   bg-surface border border-border-color rounded-lg
                                   hover:bg-bg-color hover:text-text-primary
                                   active:scale-[0.98] transition-all duration-200 cursor-pointer
                                   focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                        닫기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!--
        Toast Notification
        - 사용자에게 짧은 알림 메시지를 표시합니다.
        - JavaScript에서 showToast() 함수로 제어합니다.
        - 3초 후 자동으로 사라집니다.
    -->
    <div id="toast" class="toast"></div>

    <!--
        Scripts
        - auth.js: 인증 관련 유틸리티 (토큰 관리, 로그인 체크)
        - api.js: API 호출 유틸리티 (fetch 래퍼, 401 자동 처리)
        - pagination.js: 페이지네이션 렌더링 유틸리티
        - hosts.js: 호스트 목록 페이지 로직 (데이터 로딩, 테이블 렌더링, 페이지네이션)

        순서가 중요합니다:
        1. auth.js가 먼저 로드되어 Auth 전역 객체 생성
        2. api.js가 Auth를 사용하여 API 전역 객체 생성
        3. pagination.js가 PaginationUtil 전역 객체 생성
        4. hosts.js가 API와 PaginationUtil을 사용하여 데이터 로드 및 렌더링
    -->
    <script th:src="@{/js/admin/auth.js}"></script>
    <script th:src="@{/js/admin/api.js}"></script>
    <script th:src="@{/js/admin/pagination.js}"></script>
    <script th:src="@{/js/admin/hosts.js}"></script>
</body>
</html>
