<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaces Management - Forgather Admin</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Design System: Forgather Admin
                        primary: {
                            DEFAULT: '#0891B2',
                            hover: '#0E7490',
                            light: '#22D3EE',
                        },
                        secondary: {
                            DEFAULT: '#22D3EE',
                            hover: '#06B6D4',
                        },
                        cta: {
                            DEFAULT: '#22C55E',
                            hover: '#16A34A',
                        },
                        success: '#22C55E',
                        danger: '#EF4444',
                        warning: '#F59E0B',
                        info: '#0891B2',
                        // Surface & Background
                        surface: '#FFFFFF',
                        'bg-color': '#ECFEFF',
                        'border-color': '#E2E8F0',
                        // Text
                        'text-primary': '#164E63',
                        'text-secondary': '#475569',
                        'text-muted': '#94A3B8',
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['SF Mono', 'Monaco', 'Cascadia Code', 'monospace'],
                    },
                    boxShadow: {
                        'sm': '0 1px 2px rgba(0,0,0,0.05)',
                        'md': '0 4px 6px rgba(0,0,0,0.1)',
                        'lg': '0 10px 15px rgba(0,0,0,0.1)',
                        'xl': '0 20px 25px rgba(0,0,0,0.15)',
                    },
                    spacing: {
                        'xs': '0.25rem',
                        'sm': '0.5rem',
                        'md': '1rem',
                        'lg': '1.5rem',
                        'xl': '2rem',
                        '2xl': '3rem',
                        '3xl': '4rem',
                    },
                },
            },
        }
    </script>

    <!-- Common CSS (Toast 등 JS 연동 클래스용) -->
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <!-- Spaces CSS (JS 동적 생성 요소용: badge, empty-state, table rows) -->
    <link rel="stylesheet" th:href="@{/css/admin/spaces.css}">

    <style>
        /* JS 연동 클래스: Modal */
        .modal-overlay {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .modal-container {
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.show .modal-container {
            transform: translateY(0);
        }
        /* Body scroll lock */
        body.modal-open {
            overflow: hidden;
        }
        /* Spinner animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-bg-color font-sans">
    <!-- Header (Fragment 참조) -->
    <header class="bg-surface border-b border-border-color shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-lg py-md flex justify-between items-center">
            <div class="flex items-center">
                <h1 class="text-xl font-semibold">
                    <a th:href="@{/view/admin/spaces}" class="text-text-primary hover:text-primary transition-colors duration-200 cursor-pointer">
                        Forgather Admin
                    </a>
                </h1>
            </div>
            <nav>
                <ul class="flex items-center gap-lg">
                    <li>
                        <a th:href="@{/view/admin/spaces}"
                           class="text-primary bg-primary/10 font-medium transition-colors duration-200 cursor-pointer px-sm py-xs rounded">
                            Spaces
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/view/admin/hosts}"
                           class="text-text-secondary hover:text-primary font-medium transition-colors duration-200 cursor-pointer px-sm py-xs rounded">
                            Hosts
                        </a>
                    </li>
                    <li>
                        <button id="logoutBtn"
                                class="px-md py-sm text-sm font-medium text-text-secondary border border-border-color rounded bg-transparent hover:bg-gray-50 hover:text-text-primary transition-all duration-200 cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                            Logout
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 py-xl">
        <div class="max-w-7xl mx-auto px-lg">
            <!-- Page Header -->
            <div class="mb-xl pb-lg border-b border-border-color">
                <h2 class="text-3xl font-bold text-text-primary mb-xs">스페이스 관리 페이지</h2>
                <p class="text-text-secondary text-base">전체 스페이스 조회 및 관리 페이지</p>
            </div>

            <!-- Controls -->
            <div class="flex flex-col gap-lg mb-lg p-lg bg-surface rounded-xl shadow-sm">
                <!--
                    이름 검색 영역
                    - 스페이스 이름으로 검색하는 독립 검색 기능
                    - 기존 필터와 상호 배타적: 이름 검색 시 필터 초기화, 필터 사용 시 검색어 초기화
                    - Enter 키 또는 검색 버튼 클릭으로 검색 실행
                -->
                <div class="flex flex-col sm:flex-row items-start sm:items-center gap-md pb-md border-b border-border-color">
                    <label class="text-sm font-semibold text-text-primary whitespace-nowrap" for="nameSearchInput">스페이스 이름:</label>
                    <div class="flex items-center gap-sm flex-1 w-full sm:max-w-md">
                        <input type="text"
                               id="nameSearchInput"
                               class="flex-1 px-md py-2.5 text-sm border border-border-color rounded-lg bg-surface text-text-primary placeholder-text-muted
                                      focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20
                                      transition-all duration-200"
                               placeholder="스페이스 이름 입력"
                               autocomplete="off">
                        <button type="button" id="nameSearchBtn"
                                class="px-lg py-2.5 text-sm font-medium text-white bg-primary rounded-lg whitespace-nowrap
                                       hover:bg-primary-hover active:scale-[0.98]
                                       transition-all duration-200 cursor-pointer">
                            검색
                        </button>
                        <!-- 검색 중일 때만 표시되는 초기화 버튼 -->
                        <button type="button" id="nameSearchResetBtn"
                                class="px-md py-2.5 text-sm font-medium text-text-secondary bg-surface border border-border-color rounded-lg whitespace-nowrap
                                       hover:bg-bg-color hover:text-text-primary hover:border-text-secondary active:scale-[0.98]
                                       transition-all duration-200 cursor-pointer"
                                style="display: none;">
                            초기화
                        </button>
                    </div>
                </div>

                <!--
                    필터 영역
                    - 작품 소개 등록 여부에 따른 필터링 기능
                    - radio 버튼으로 단일 선택 제공
                    - 향후 다른 필터 조건 추가 시 filter-group을 복사하여 확장
                -->
                <div class="flex flex-col sm:flex-row items-start sm:items-center gap-lg flex-1">
                    <!--
                        작품 소개 등록 여부 필터 그룹
                        - name 속성을 동일하게 하여 radio 그룹화
                        - value: 'all' (전체), 'true' (등록함), 'false' (미등록)
                        - 기본값은 'all' (checked 속성)
                    -->
                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-md flex-wrap">
                        <label class="text-sm font-semibold text-text-primary whitespace-nowrap">작품 소개 등록 여부:</label>
                        <label class="inline-flex items-center gap-xs cursor-pointer px-sm py-xs rounded-lg hover:bg-bg-color transition-colors duration-200 text-sm text-text-primary">
                            <input type="radio" name="hasProduct" value="all" checked
                                   class="w-4 h-4 cursor-pointer">
                            <span>전체</span>
                        </label>
                        <label class="inline-flex items-center gap-xs cursor-pointer px-sm py-xs rounded-lg hover:bg-bg-color transition-colors duration-200 text-sm text-text-primary">
                            <input type="radio" name="hasProduct" value="true"
                                   class="w-4 h-4 cursor-pointer">
                            <span>등록함</span>
                        </label>
                        <label class="inline-flex items-center gap-xs cursor-pointer px-sm py-xs rounded-lg hover:bg-bg-color transition-colors duration-200 text-sm text-text-primary">
                            <input type="radio" name="hasProduct" value="false"
                                   class="w-4 h-4 cursor-pointer">
                            <span>등록하지 않음</span>
                        </label>
                    </div>

                    <!--
                        검색 버튼
                        - 필터 선택 후 이 버튼을 클릭해야 필터가 적용됨
                        - JavaScript의 applyFilter() 함수 호출
                    -->
                    <button type="button" id="applyFilterBtn"
                            class="px-xl py-2.5 text-sm font-medium text-white bg-primary rounded-lg whitespace-nowrap
                                   hover:bg-primary-hover active:scale-[0.98]
                                   transition-all duration-200 cursor-pointer
                                   sm:w-auto w-full">
                        검색
                    </button>
                </div>

                <div class="flex items-center gap-sm pt-md border-t border-border-color sm:border-0 sm:pt-0 sm:ml-auto">
                    <label for="pageSize" class="text-sm font-medium text-text-secondary whitespace-nowrap">Items per page:</label>
                    <select id="pageSize"
                            class="px-md py-2 text-sm border border-border-color rounded-lg bg-surface text-text-primary
                                   focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20
                                   transition-all duration-200 cursor-pointer min-w-[80px]">
                        <option value="15" selected>15</option>
                        <option value="30">30</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingSpinner"
                 class="flex flex-col items-center justify-center py-2xl text-text-secondary"
                 style="display: none;">
                <div class="w-10 h-10 border-4 border-border-color border-t-primary rounded-full animate-spin"></div>
                <p class="mt-md text-sm">Loading...</p>
            </div>

            <!-- Error Message -->
            <div id="errorMessage"
                 class="p-md bg-red-50 border border-red-200 rounded-lg text-danger text-sm text-center mb-lg"
                 style="display: none;">
            </div>

            <!-- Spaces Table -->
            <div class="bg-surface rounded-xl shadow-sm overflow-hidden mb-lg">
                <div class="overflow-x-auto">
                    <table id="spacesTable" class="w-full">
                        <thead>
                            <tr class="bg-bg-color border-b border-border-color">
                                <th class="px-lg py-md text-left text-xs font-semibold text-text-secondary uppercase tracking-wider w-[7%]">ID</th>
                                <th class="px-lg py-md text-left text-xs font-semibold text-text-secondary uppercase tracking-wider w-[15%]">스페이스 코드</th>
                                <th class="px-lg py-md text-left text-xs font-semibold text-text-secondary uppercase tracking-wider w-[25%]">스페이스 이름</th>
                                <th class="px-lg py-md text-center text-xs font-semibold text-text-secondary uppercase tracking-wider w-[10%]">스페이스 공개 여부</th>
                                <th class="px-lg py-md text-left text-xs font-semibold text-text-secondary uppercase tracking-wider w-[18%]">생성 시간</th>
                                <th class="px-lg py-md text-left text-xs font-semibold text-text-secondary uppercase tracking-wider w-[18%]">수정 시간</th>
                            </tr>
                        </thead>
                        <tbody id="spacesTableBody" class="divide-y divide-border-color">
                            <!-- Data will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination: JavaScript에서 숫자 버튼들을 동적으로 생성 -->
            <div id="pagination" class="flex justify-center items-center gap-sm py-lg" style="display: none;"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-surface border-t border-border-color mt-auto">
        <div class="max-w-7xl mx-auto px-lg py-lg text-center">
            <p class="text-text-muted text-sm">&copy; 2025 Forgather. All rights reserved.</p>
        </div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!--
        스페이스 상세 정보 모달
        - 기본적으로 숨김 상태 (display: none)
        - JavaScript에서 spaceCode 클릭 시 표시
        - ESC 키 또는 오버레이 클릭 시 닫힘
        - 모달이 열렸을 때 body의 스크롤 방지
    -->
    <div id="spaceDetailModal"
         class="modal-overlay fixed inset-0 bg-black/60 flex justify-center items-center z-[10000]"
         style="display: none;"
         role="dialog" aria-labelledby="modalTitle" aria-modal="true">
        <div class="modal-container bg-surface rounded-xl shadow-xl max-w-[600px] w-[90%] max-h-[85vh] flex flex-col">
            <!-- 모달 헤더 -->
            <div class="flex justify-between items-center p-lg border-b border-border-color">
                <h3 id="modalTitle" class="text-xl font-bold text-text-primary m-0">Space Details</h3>
                <button id="closeModalBtn"
                        class="w-8 h-8 flex items-center justify-center text-2xl text-text-secondary bg-transparent border-none rounded-lg cursor-pointer
                               hover:bg-bg-color hover:text-text-primary transition-all duration-200"
                        aria-label="Close modal">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <!-- 모달 내용 -->
            <div class="p-lg overflow-y-auto flex-1">
                <!-- 로딩 상태 표시 -->
                <div id="modalLoading" class="flex flex-col items-center justify-center py-2xl text-text-secondary" style="display: none;">
                    <div class="w-10 h-10 border-3 border-border-color border-t-primary rounded-full animate-spin"></div>
                    <p class="mt-md text-sm">Loading space details...</p>
                </div>

                <!-- 에러 상태 표시 -->
                <div id="modalError"
                     class="p-md bg-red-50 border border-red-200 rounded-lg text-danger text-sm text-center"
                     style="display: none;">
                </div>

                <!-- 스페이스 상세 정보 (데이터가 로드되면 JavaScript로 채워짐) -->
                <div id="modalContent" class="flex flex-col gap-lg" style="display: none;">
                    <div class="flex flex-col gap-xs">
                        <label class="text-xs font-semibold text-text-secondary uppercase tracking-wider">스페이스 ID</label>
                        <div id="modalSpaceId" class="text-base text-text-primary px-md py-sm bg-bg-color rounded-lg border border-border-color"></div>
                    </div>

                    <div class="flex flex-col gap-xs">
                        <label class="text-xs font-semibold text-text-secondary uppercase tracking-wider">스페이스 코드</label>
                        <div id="modalSpaceCode" class="text-sm text-text-primary px-md py-sm bg-bg-color rounded-lg border border-border-color font-mono"></div>
                    </div>

                    <div class="flex flex-col gap-xs">
                        <label class="text-xs font-semibold text-text-secondary uppercase tracking-wider">스페이스 이름</label>
                        <div id="modalSpaceName" class="text-base text-text-primary px-md py-sm bg-bg-color rounded-lg border border-border-color"></div>
                    </div>

                    <div class="flex flex-col gap-xs">
                        <label class="text-xs font-semibold text-text-secondary uppercase tracking-wider">스페이스 공개 여부</label>
                        <div id="modalSpacePublic" class="text-base text-text-primary px-md py-sm bg-bg-color rounded-lg border border-border-color"></div>
                    </div>

                    <div class="flex flex-col gap-xs">
                        <label class="text-xs font-semibold text-text-secondary uppercase tracking-wider">등록한 작품 소개</label>
                        <div id="modalHasProduct" class="text-base text-text-primary px-md py-sm bg-bg-color rounded-lg border border-border-color"></div>
                    </div>

                    <div class="flex flex-col gap-xs">
                        <label class="text-xs font-semibold text-text-secondary uppercase tracking-wider">방명록 개수</label>
                        <div id="modalGuestBookCount" class="text-base text-text-primary px-md py-sm bg-bg-color rounded-lg border border-border-color"></div>
                    </div>
                </div>
            </div>

            <!-- 모달 푸터 (게스트 페이지 이동 버튼) -->
            <div class="p-lg border-t border-border-color flex justify-end">
                <button id="visitSpaceBtn"
                        class="min-w-[150px] px-lg py-md text-sm font-semibold text-white bg-cta rounded-lg
                               hover:bg-cta-hover active:scale-[0.98]
                               transition-all duration-200 cursor-pointer
                               focus:outline-none focus:ring-2 focus:ring-cta focus:ring-offset-2"
                        style="display: none;"
                        aria-label="게스트 페이지로 이동">
                    게스트 페이지로 이동
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/admin/auth.js}"></script>
    <script th:src="@{/js/admin/api.js}"></script>
    <script th:src="@{/js/admin/pagination.js}"></script>
    <script th:src="@{/js/admin/spaces.js}"></script>
</body>
</html>
