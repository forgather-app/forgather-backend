<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Management - Forgather Admin</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (build-time) -->
    <link rel="stylesheet" th:href="@{/css/admin/tailwind-output.css}">

    <!-- Common CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <!-- Products CSS (JS 동적 생성 요소용: badge, empty-state, 설명 블록) -->
    <link rel="stylesheet" th:href="@{/css/admin/products.css}">
</head>
<body class="min-h-screen flex flex-col bg-bg-color font-sans">
    <!-- Header (Fragment 사용) -->
    <header th:replace="~{admin/layout/fragments :: header(currentPage='products')}"></header>

    <!-- Main Content -->
    <main class="flex-1 py-xl">
        <div class="max-w-7xl mx-auto px-lg">
            <!-- Page Header -->
            <div class="mb-xl pb-lg border-b border-border-color">
                <h2 class="text-3xl font-bold text-text-primary mb-xs">작품 관리 페이지</h2>
                <p class="text-text-secondary text-base">스페이스 구분 없이 전체 작품을 조회하는 페이지</p>
            </div>

            <!--
                필터 영역 (스페이스 코드)
                - 필터 API (/admin/products/search)와 연동
                - 작품명 검색과 상호 배타적으로 동작 (필터 적용 시 검색어 초기화)
            -->
            <div class="flex flex-wrap items-center justify-between gap-md mb-lg p-lg bg-surface rounded-xl shadow-sm">
                <div class="flex flex-wrap items-center gap-md">
                    <label for="spaceCodeFilterInput" class="text-sm font-semibold text-text-primary whitespace-nowrap">스페이스 코드:</label>
                    <input type="text"
                           id="spaceCodeFilterInput"
                           maxlength="10"
                           class="w-48 px-md py-2.5 min-h-[44px] text-sm font-mono border border-border-color rounded-lg bg-surface text-text-primary placeholder-text-muted
                                  focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20
                                  transition-all duration-200"
                           placeholder="10자리 코드"
                           autocomplete="off">
                    <button type="button" id="applyFilterBtn"
                            class="px-lg py-2.5 min-h-[44px] text-sm font-medium text-white bg-primary rounded-lg whitespace-nowrap
                                   hover:bg-primary-hover active:scale-[0.98]
                                   transition-all duration-200 cursor-pointer">
                        필터 적용
                    </button>
                    <button type="button" id="resetFilterBtn"
                            class="px-md py-2.5 min-h-[44px] text-sm font-medium text-text-secondary bg-surface border border-border-color rounded-lg whitespace-nowrap
                                   hover:bg-bg-color hover:text-text-primary active:scale-[0.98]
                                   transition-all duration-200 cursor-pointer"
                            style="display: none;">
                        필터 해제
                    </button>
                </div>
                <div class="flex items-center gap-sm">
                    <label for="pageSize" class="text-sm font-medium text-text-secondary whitespace-nowrap">페이지당 항목:</label>
                    <select id="pageSize"
                            class="px-md py-2.5 min-h-[44px] text-sm border border-border-color rounded-lg bg-surface text-text-primary
                                   focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20
                                   transition-all duration-200 cursor-pointer min-w-[80px]">
                        <option value="15" selected>15</option>
                        <option value="30">30</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </div>

            <!--
                테이블 상단 컨트롤: 총 개수 + 작품명 검색
                - 작품명 검색 API (/admin/products/search/by-title)와 연동
                - 필터와 상호 배타적으로 동작 (검색 시 필터 초기화)
            -->
            <div class="flex flex-wrap items-center justify-between gap-md mb-md">
                <div id="totalCountInfo" class="text-sm text-text-secondary font-medium">
                    <!-- JavaScript에서 동적으로 업데이트 -->
                </div>
                <div class="flex items-center gap-sm">
                    <div class="relative">
                        <input type="text"
                               id="titleSearchInput"
                               class="w-64 pl-md pr-12 py-2.5 min-h-[44px] text-sm border border-border-color rounded-lg bg-surface text-text-primary placeholder-text-muted
                                      focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20
                                      transition-all duration-200"
                               placeholder="작품명 검색..."
                               autocomplete="off">
                        <button type="button" id="titleSearchBtn"
                                class="absolute right-0 top-1/2 -translate-y-1/2 p-2.5 min-w-[44px] min-h-[44px] flex items-center justify-center text-text-muted hover:text-primary rounded transition-colors duration-150 cursor-pointer"
                                aria-label="검색">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </button>
                    </div>
                    <button type="button" id="resetSearchBtn"
                            class="px-md py-2.5 min-h-[44px] text-sm font-medium text-text-secondary bg-surface border border-border-color rounded-lg whitespace-nowrap
                                   hover:bg-bg-color hover:text-text-primary active:scale-[0.98]
                                   transition-all duration-200 cursor-pointer"
                            style="display: none;">
                        초기화
                    </button>
                </div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage"
                 class="p-md bg-red-50 border border-red-200 rounded-lg text-danger text-sm text-center mb-lg"
                 style="display: none;">
            </div>

            <!-- Products Table -->
            <div class="bg-surface rounded-xl shadow-sm overflow-hidden mb-lg">
                <div class="overflow-x-auto table-scroll-wrapper" id="tableScrollWrapper">
                    <table id="productsTable" class="w-full table-fixed min-w-[1100px]">
                        <thead>
                            <tr class="bg-neutral-100 border-b-2 border-neutral-300">
                                <th class="px-lg py-md text-left text-xs font-bold text-text-primary uppercase tracking-wider w-[80px]">ID</th>
                                <th class="px-lg py-md text-left text-xs font-bold text-text-primary uppercase tracking-wider cursor-pointer hover:bg-neutral-200 transition-colors duration-150 select-none group"
                                    data-sort="title">
                                    <div class="flex items-center gap-xs">
                                        <span>작품명</span>
                                        <span class="sort-icon text-text-muted transition-opacity duration-150"></span>
                                    </div>
                                </th>
                                <th class="px-lg py-md text-left text-xs font-bold text-text-primary uppercase tracking-wider w-[140px]">작가명</th>
                                <th class="px-lg py-md text-left text-xs font-bold text-text-primary uppercase tracking-wider w-[200px]">스페이스</th>
                                <th class="px-md py-md text-center text-xs font-bold text-text-primary uppercase tracking-wider w-[72px]">사진</th>
                                <th class="px-md py-md text-center text-xs font-bold text-text-primary uppercase tracking-wider w-[88px]">영상</th>
                                <th class="px-md py-md text-left text-xs font-bold text-text-primary uppercase tracking-wider w-[176px] cursor-pointer hover:bg-neutral-200 transition-colors duration-150 select-none group"
                                    data-sort="createdAt">
                                    <div class="flex items-center gap-xs">
                                        <span>등록 시간</span>
                                        <span class="sort-icon text-text-muted transition-opacity duration-150"></span>
                                    </div>
                                </th>
                                <th class="px-md py-md text-left text-xs font-bold text-text-primary uppercase tracking-wider w-[176px] cursor-pointer hover:bg-neutral-200 transition-colors duration-150 select-none group"
                                    data-sort="updatedAt">
                                    <div class="flex items-center gap-xs">
                                        <span>수정 시간</span>
                                        <span class="sort-icon text-text-muted transition-opacity duration-150"></span>
                                    </div>
                                </th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody" class="divide-y divide-border-color">
                            <!-- Data will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination: JavaScript에서 숫자 버튼들을 동적으로 생성 -->
            <div id="pagination" class="flex justify-center items-center gap-sm py-lg" style="display: none;"></div>
        </div>
    </main>

    <!-- Footer (Fragment 사용) -->
    <footer th:replace="~{admin/layout/fragments :: footer}"></footer>

    <!--
        작품 상세 정보 모달
        - 작품명 클릭(또는 Enter/Space) 시 표시
        - ESC 키, 오버레이 클릭, 닫기 버튼으로 닫힘
        - 모달이 열렸을 때 body의 스크롤 방지
    -->
    <div id="productDetailModal"
         class="modal-overlay fixed inset-0 bg-black/60 flex justify-center items-center z-[10000]"
         style="display: none;"
         role="dialog" aria-labelledby="modalTitle" aria-modal="true">
        <div class="modal-container bg-surface rounded-xl shadow-xl max-w-[760px] w-[90%] max-h-[85vh] flex flex-col">
            <!-- 모달 헤더 -->
            <div class="flex justify-between items-center p-lg border-b border-border-color">
                <h3 id="modalTitle" class="text-xl font-bold text-text-primary m-0">작품 상세</h3>
                <button id="closeModalBtn"
                        class="w-11 h-11 flex items-center justify-center text-2xl text-text-secondary bg-transparent border-none rounded-lg cursor-pointer
                               hover:bg-bg-color hover:text-text-primary transition-all duration-200"
                        aria-label="Close modal">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <!-- 모달 내용 -->
            <div class="p-lg overflow-y-auto flex-1">
                <!-- 로딩 상태 표시 -->
                <div id="modalLoading" class="flex flex-col items-center justify-center py-2xl text-text-secondary" style="display: none;">
                    <div class="w-10 h-10 border-4 border-border-color border-t-primary rounded-full animate-spin"></div>
                    <p class="mt-md text-sm">작품 정보 로딩 중...</p>
                </div>

                <!-- 에러 상태 표시 -->
                <div id="modalError"
                     class="p-md bg-red-50 border border-red-200 rounded-lg text-danger text-sm text-center"
                     style="display: none;">
                </div>

                <!-- 작품 상세 정보 (데이터가 로드되면 JavaScript로 채워짐) -->
                <div id="modalContent" style="display: none;">
                    <dl class="grid grid-cols-[auto_1fr] gap-x-6 gap-y-4">
                        <dt class="text-xs font-semibold text-text-secondary uppercase tracking-wider py-1">작품 ID</dt>
                        <dd id="modalProductId" class="text-sm text-text-primary py-2 px-3 bg-neutral-50 rounded-md"></dd>

                        <dt class="text-xs font-semibold text-text-secondary uppercase tracking-wider py-1">작품명</dt>
                        <dd id="modalProductTitle" class="text-sm text-text-primary font-medium py-2 px-3 bg-neutral-50 rounded-md break-all"></dd>

                        <dt class="text-xs font-semibold text-text-secondary uppercase tracking-wider py-1">작가명</dt>
                        <dd id="modalAuthorName" class="text-sm text-text-primary py-2 px-3 bg-neutral-50 rounded-md break-all"></dd>

                        <dt class="text-xs font-semibold text-text-secondary uppercase tracking-wider py-1">스페이스</dt>
                        <dd id="modalSpace" class="text-sm text-text-primary py-2 px-3 bg-neutral-50 rounded-md"></dd>

                        <dt class="text-xs font-semibold text-text-secondary uppercase tracking-wider py-1">호스트</dt>
                        <dd id="modalHost" class="text-sm text-text-primary py-2 px-3 bg-neutral-50 rounded-md"></dd>

                        <dt class="text-xs font-semibold text-text-secondary uppercase tracking-wider py-1">영상 링크</dt>
                        <dd id="modalVideoUrl" class="text-sm text-text-primary py-2 px-3 bg-neutral-50 rounded-md break-all"></dd>

                        <dt class="text-xs font-semibold text-text-secondary uppercase tracking-wider py-1">영상 위치</dt>
                        <dd id="modalVideoPosition" class="text-sm text-text-primary py-2 px-3 bg-neutral-50 rounded-md"></dd>

                        <dt class="text-xs font-semibold text-text-secondary uppercase tracking-wider py-1">등록 시간</dt>
                        <dd id="modalCreatedAt" class="text-sm text-text-primary font-mono py-2 px-3 bg-neutral-50 rounded-md"></dd>

                        <dt class="text-xs font-semibold text-text-secondary uppercase tracking-wider py-1">수정 시간</dt>
                        <dd id="modalUpdatedAt" class="text-sm text-text-primary font-mono py-2 px-3 bg-neutral-50 rounded-md"></dd>
                    </dl>

                    <section class="mt-lg">
                        <h4 class="text-xs font-semibold text-text-secondary uppercase tracking-wider mb-sm">작품 설명</h4>
                        <div id="modalDescription" class="description-block text-sm text-text-primary p-3 bg-neutral-50 rounded-md"></div>
                    </section>

                    <section class="mt-lg">
                        <h4 class="text-xs font-semibold text-text-secondary uppercase tracking-wider mb-sm">
                            사진 <span id="modalPhotoCount" class="text-text-muted normal-case"></span>
                        </h4>
                        <p id="modalPhotosEmpty" class="text-sm text-text-muted p-3 bg-neutral-50 rounded-md" style="display: none;">등록된 사진이 없습니다.</p>
                        <div id="modalPhotosTableWrapper" class="overflow-x-auto border border-border-color rounded-md" style="display: none;">
                            <table class="w-full table-fixed photo-table">
                                <thead>
                                    <tr class="bg-neutral-100">
                                        <th class="px-3 py-2 text-left text-xs font-semibold text-text-secondary w-[60px]">순서</th>
                                        <th class="px-3 py-2 text-left text-xs font-semibold text-text-secondary">파일명</th>
                                        <th class="px-3 py-2 text-right text-xs font-semibold text-text-secondary w-[110px]">용량</th>
                                    </tr>
                                </thead>
                                <tbody id="modalPhotosBody" class="divide-y divide-border-color">
                                    <!-- JavaScript에서 동적으로 생성 -->
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>

            <!-- 모달 푸터 (닫기 + 게스트 페이지 이동 버튼) -->
            <div class="p-lg border-t border-border-color flex justify-end gap-3">
                <button id="closeModalFooterBtn"
                        class="min-h-[44px] px-lg py-2.5 text-sm font-medium text-text-secondary
                               bg-surface border border-border-color rounded-lg
                               hover:bg-bg-color hover:text-text-primary
                               active:scale-[0.98] transition-all duration-200 cursor-pointer
                               focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                    닫기
                </button>
                <button id="visitSpaceBtn"
                        class="min-w-[150px] min-h-[44px] px-lg py-3 text-sm font-semibold text-white bg-cta rounded-lg
                               hover:bg-cta-hover active:scale-[0.98]
                               transition-all duration-200 cursor-pointer
                               focus:outline-none focus:ring-2 focus:ring-cta focus:ring-offset-2"
                        style="display: none;"
                        aria-label="작품이 속한 스페이스의 게스트 페이지로 이동">
                    게스트 페이지로 이동
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/admin/auth.js}"></script>
    <script th:src="@{/js/admin/api.js}"></script>
    <script th:src="@{/js/admin/pagination.js}"></script>
    <script th:src="@{/js/admin/products.js}"></script>
</body>
</html>
