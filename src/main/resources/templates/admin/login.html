<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Forgather</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (build-time) -->
    <link rel="stylesheet" th:href="@{/css/admin/tailwind-output.css}">
</head>
<body class="min-h-screen flex justify-center items-center bg-gradient-to-br from-neutral-900 to-neutral-700 p-lg font-sans">
    <div class="w-full max-w-md">
        <div class="bg-surface rounded-xl shadow-xl p-8 sm:p-10">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-2xl sm:text-3xl font-bold text-primary mb-2">
                    Forgather Admin
                </h1>
                <p class="text-text-secondary text-sm">
                    Please sign in to continue
                </p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="mb-6">
                <div class="mb-4">
                    <label for="username" class="block text-sm font-medium text-text-primary mb-2">
                        Username
                    </label>
                    <input type="text" id="username" name="username"
                           class="w-full px-4 py-3 border border-border-color rounded-lg text-text-primary placeholder-text-muted
                                  focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20
                                  transition-all duration-200"
                           placeholder="Enter your username" required autofocus>
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-text-primary mb-2">
                        Password
                    </label>
                    <input type="password" id="password" name="password"
                           class="w-full px-4 py-3 border border-border-color rounded-lg text-text-primary placeholder-text-muted
                                  focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20
                                  transition-all duration-200"
                           placeholder="Enter your password" required>
                </div>

                <!-- Error Message -->
                <div id="errorMessage"
                     class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-danger text-sm"
                     style="display: none;">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="loginBtn"
                        class="w-full py-3 px-6 bg-primary text-white font-semibold rounded-lg
                               hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2
                               transition-all duration-200 cursor-pointer">
                    Sign In
                </button>
            </form>

            <!-- Footer -->
            <div class="text-center pt-6 border-t border-border-color">
                <p class="text-text-muted text-xs">
                    &copy; 2025 Forgather. All rights reserved.
                </p>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner"
         class="fixed inset-0 bg-black/50 flex flex-col justify-center items-center z-[9999]"
         style="display: none;">
        <div class="w-12 h-12 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
        <p class="text-white mt-4 font-medium">Loading...</p>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/admin/auth.js}"></script>
    <script th:src="@{/js/admin/api.js}"></script>
    <script th:src="@{/js/admin/login.js}"></script>
</body>
</html>
