<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Header Fragment -->
<header th:fragment="header(currentPage)" class="bg-surface border-b border-border-color shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-lg py-md flex justify-between items-center">
        <div class="flex items-center">
            <h1 class="text-xl font-semibold">
                <a th:href="@{/view/admin/spaces}" class="text-text-primary hover:text-primary transition-colors duration-200 cursor-pointer">
                    Forgather Admin
                </a>
            </h1>
        </div>
        <nav>
            <ul class="flex items-center gap-lg">
                <li>
                    <a th:href="@{/view/admin/spaces}"
                       class="text-text-secondary hover:text-primary font-medium transition-colors duration-200 cursor-pointer px-sm py-xs rounded"
                       th:classappend="${currentPage == 'spaces'} ? 'text-primary bg-neutral-100' : ''">
                        Spaces
                    </a>
                </li>
                <li>
                    <a th:href="@{/view/admin/hosts}"
                       class="text-text-secondary hover:text-primary font-medium transition-colors duration-200 cursor-pointer px-sm py-xs rounded"
                       th:classappend="${currentPage == 'hosts'} ? 'text-primary bg-neutral-100' : ''">
                        Hosts
                    </a>
                </li>
                <li>
                    <a th:href="@{/view/admin/security}"
                       class="text-text-secondary hover:text-primary font-medium transition-colors duration-200 cursor-pointer px-sm py-xs rounded"
                       th:classappend="${currentPage == 'security'} ? 'text-primary bg-neutral-100' : ''">
                        Security
                    </a>
                </li>
                <li>
                    <button id="logoutBtn"
                            class="px-md py-2.5 min-h-[44px] text-sm font-medium text-text-secondary border border-border-color rounded bg-transparent hover:bg-gray-50 hover:text-text-primary transition-all duration-200 cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                        로그아웃
                    </button>
                </li>
            </ul>
        </nav>
    </div>
</header>

<!-- Footer Fragment -->
<footer th:fragment="footer" class="bg-surface border-t border-border-color mt-auto">
    <div class="max-w-7xl mx-auto px-lg py-lg text-center">
        <p class="text-text-muted text-sm">&copy; 2025 Forgather. All rights reserved.</p>
    </div>
</footer>

<!-- Pagination Fragment -->
<div th:fragment="pagination(page)" class="pagination">
    <button class="pagination-btn" th:disabled="${page.currentPage <= 1}"
            th:onclick="|goToPage(${page.currentPage - 1})|">
        Previous
    </button>

    <span class="pagination-info">
        <span th:text="${page.totalPages}">1</span>페이지 중 <span th:text="${page.currentPage}">1</span>페이지
        (전체: <span th:text="${page.totalCount}">0</span>개)
    </span>

    <button class="pagination-btn" th:disabled="${page.currentPage >= page.totalPages}"
            th:onclick="|goToPage(${page.currentPage + 1})|">
        Next
    </button>
</div>

<!-- Loading Spinner Fragment -->
<div th:fragment="loading" id="loadingSpinner"
     class="loading-spinner fixed inset-0 bg-black/50 flex flex-col justify-center items-center z-[9999]"
     style="display: none;">
    <div class="w-12 h-12 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
    <p class="text-white mt-md font-medium">로딩 중...</p>
</div>

<!-- Toast Notification Fragment -->
<!-- Note: .toast, .show, .success, .error, .warning 클래스는 JS에서 동적 제어하므로 common.css에서 유지 -->
<div th:fragment="toast" id="toast" class="toast"></div>

</body>
</html>
