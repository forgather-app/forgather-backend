plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.forgather'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.rest-assured:spring-mock-mvc'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// TestContainers
	testImplementation 'org.testcontainers:testcontainers:2.0.2'
	testImplementation 'org.testcontainers:testcontainers-mysql:2.0.2'

	// logback
	implementation("net.logstash.logback:logstash-logback-encoder:8.0")

	// Flyway
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// AWS
	implementation platform("software.amazon.awssdk:bom:2.27.21")
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:s3-transfer-manager'

	// image download
	implementation 'net.lingala.zip4j:zip4j:2.11.5'

	// metadata-extractor
	implementation 'com.drewnoakes:metadata-extractor:2.19.0'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

	// hibernate validation
	implementation("org.springframework.boot:spring-boot-starter-validation:3.4.7")

	// Spring Security Crypto (BCrypt)
	implementation 'org.springframework.security:spring-security-crypto'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Metrics
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    // thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // WireMock
    testImplementation 'org.wiremock:wiremock-standalone:3.10.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

// =============================================================================
// Tailwind CSS Standalone CLI
// =============================================================================

def tailwindVersion = '3.4.17'
def tailwindDir = file("${rootDir}/tailwind")
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def tailwindBin = file("${tailwindDir}/.bin/tailwindcss${isWindows ? '.exe' : ''}")
def tailwindInput = file("${tailwindDir}/input.css")
def tailwindConfig = file("${tailwindDir}/tailwind.config.js")
def tailwindOutput = file("${rootDir}/src/main/resources/static/css/admin/tailwind-output.css")

tasks.register('downloadTailwind') {
	description = 'Downloads the Tailwind CSS standalone CLI binary'
	group = 'tailwind'

	outputs.file(tailwindBin)

	doLast {
		def os = System.getProperty('os.name').toLowerCase()
		def arch = System.getProperty('os.arch').toLowerCase()

		def platform
		if (os.contains('mac') || os.contains('darwin')) {
			platform = arch.contains('aarch64') || arch.contains('arm') ? 'macos-arm64' : 'macos-x64'
		} else if (os.contains('linux')) {
			platform = arch.contains('aarch64') || arch.contains('arm') ? 'linux-arm64' : 'linux-x64'
		} else if (os.contains('windows')) {
			platform = arch.contains('aarch64') || arch.contains('arm') ? 'windows-arm64' : 'windows-x64'
		} else {
			throw new GradleException("Unsupported OS: ${os}")
		}

		def ext = os.contains('windows') ? '.exe' : ''
		def url = "https://github.com/tailwindlabs/tailwindcss/releases/download/v${tailwindVersion}/tailwindcss-${platform}${ext}"
		def binDir = tailwindBin.parentFile
		if (!binDir.exists()) {
			binDir.mkdirs()
		}

		logger.lifecycle("Downloading Tailwind CSS v${tailwindVersion} for ${platform}...")
		ant.get(src: url, dest: tailwindBin, skipexisting: false)
		if (!os.contains('windows')) {
			tailwindBin.setExecutable(true)
		}
		logger.lifecycle("Tailwind CSS CLI downloaded to ${tailwindBin}")
	}
}

tasks.register('tailwindBuild') {
	description = 'Builds the Tailwind CSS output file'
	group = 'tailwind'
	dependsOn 'downloadTailwind'

	inputs.file(tailwindInput)
	inputs.file(tailwindConfig)
	inputs.dir("${rootDir}/src/main/resources/templates")
	inputs.dir("${rootDir}/src/main/resources/static/js/admin")
	outputs.file(tailwindOutput)

	doLast {
		exec {
			workingDir tailwindDir
			commandLine tailwindBin,
				'-i', tailwindInput.absolutePath,
				'-o', tailwindOutput.absolutePath,
				'-c', tailwindConfig.absolutePath,
				'--minify'
		}
		logger.lifecycle("Tailwind CSS built: ${tailwindOutput}")
	}
}

tasks.register('tailwindWatch') {
	description = 'Watches for changes and rebuilds Tailwind CSS'
	group = 'tailwind'
	dependsOn 'downloadTailwind'

	doLast {
		exec {
			workingDir tailwindDir
			commandLine tailwindBin,
				'-i', tailwindInput.absolutePath,
				'-o', tailwindOutput.absolutePath,
				'-c', tailwindConfig.absolutePath,
				'--watch'
		}
	}
}

processResources.dependsOn tailwindBuild
